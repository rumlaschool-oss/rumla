<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المتصدرين</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>

  :root{
    --burgundy: #7c2a49;
    --burgundy-dark: #5c1f38;
    --gold: #c9a04e;
    --gold-light: #e8cf9a;
    --blush: #fbf1f0;
    --ink: #3a2432;
    --muted: #9b8a90;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    padding:0;
    font-family:'Tajawal', Arial, Tahoma, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, #fdf2ee 0%, transparent 45%),
      radial-gradient(circle at 100% 20%, #f6e9ef 0%, transparent 50%),
      linear-gradient(180deg, #fbf1f0 0%, #f3e4e8 100%);
    color: var(--ink);
    min-height:100vh;
  }

  /* الشعار الثابت — أعلى اليسار */
  .fixed-logo{
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 999;
    width: 76px;
    height: 76px;
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 8px 20px rgba(124,42,73,0.22);
    border: 1px solid rgba(201,160,78,0.35);
    padding: 8px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .fixed-logo img{
    width:100%;
    height:100%;
    object-fit: contain;
    display:block;
  }

  .container{
    width:94%;
    max-width:900px;
    margin:0 auto;
    padding:28px 0 50px;
  }

  /* الترويسة */
  .hero{
    position:relative;
    text-align:center;
    padding: 26px 20px 30px;
    margin-bottom:30px;
    border-radius:26px;
    background: linear-gradient(180deg, #ffffff, var(--blush));
    border: 1px solid rgba(201,160,78,0.28);
    box-shadow: 0 14px 34px rgba(124,42,73,0.10);
    overflow:hidden;
  }

  .hero::before{
    content:'';
    position:absolute;
    top:0; right:0; left:0;
    height:6px;
    background: linear-gradient(90deg, var(--burgundy-dark), var(--gold), var(--burgundy-dark));
  }

  .hero-photo{
    width: 100%;
    max-width: 420px;
    height: 150px;
    margin: 10px auto 20px;
    border-radius:18px;
    overflow:hidden;
    box-shadow: 0 10px 24px rgba(124,42,73,0.16);
    border: 4px solid #fff;
  }

  .hero-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .hero .crown{
    font-size:24px;
    display:block;
    margin-bottom:6px;
  }

  .hero h1{
    margin:0;
    color: var(--burgundy-dark);
    font-size:30px;
    font-weight:900;
  }

  .hero p{
    margin:10px 0 0;
    color: var(--muted);
    font-size:15px;
    font-weight:500;
  }

  /* لوحة المتصدرين */
  .leaderboard{
    background: linear-gradient(180deg, #ffffff, #fffdfb);
    border-radius:22px;
    padding:24px;
    box-shadow: 0 10px 30px rgba(124,42,73,0.12);
    border: 1px solid rgba(201,160,78,0.25);
  }

  .leaderboard-title{
    text-align:center;
    font-size:22px;
    font-weight:900;
    color: var(--burgundy-dark);
    margin-bottom:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }

  .leaderboard-title::before,
  .leaderboard-title::after{
    content:'';
    height:1px;
    width:40px;
    background: linear-gradient(90deg, transparent, var(--gold));
  }
  .leaderboard-title::after{
    background: linear-gradient(90deg, var(--gold), transparent);
  }

  .score-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background: linear-gradient(180deg, #fdfaf7, #faf3ef);
    border: 1px solid rgba(201,160,78,0.18);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:11px;
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
  }

  .score-row:hover{
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(124,42,73,0.12);
    border-color: rgba(201,160,78,0.45);
  }

  .score-row.top1{ background: linear-gradient(180deg, #fff8e8, #fdf0d3); border-color: var(--gold); }
  .score-row.top2{ background: linear-gradient(180deg, #fbf3f6, #f6e8ee); border-color: #cbb3bd; }
  .score-row.top3{ background: linear-gradient(180deg, #fdf3ec, #f9e6d6); border-color: #d9a468; }

  .rank{
    width:44px; height:44px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:17px; font-weight:900;
    flex-shrink:0;
    background: linear-gradient(160deg, #f1e4d8, #e6d5c4);
    color: var(--burgundy-dark);
  }
  .rank.medal{ font-size:22px; background: transparent; }

  .specialty{
    flex:1;
    font-size:17px;
    font-weight:700;
    padding:0 16px;
    text-align:right;
  }

  .points{
    font-size:16.5px;
    font-weight:800;
    color: var(--burgundy-dark);
    white-space:nowrap;
    background: rgba(201,160,78,0.14);
    padding:6px 14px;
    border-radius:999px;
  }

  .message{
    text-align:center;
    margin-top:10px;
    min-height:22px;
    font-weight:700;
    font-size:14px;
  }
  .error{ color:#c0395a; }

  .loading{
    text-align:center;
    padding:34px;
    color: var(--muted);
    font-size:16px;
    font-weight:600;
  }

  .last-update{
    text-align:center;
    margin-top:14px;
    color: var(--muted);
    font-size:13px;
    font-weight:500;
  }

  /* الجوال */
  @media (max-width: 700px){
    .fixed-logo{ width:56px; height:56px; top:10px; left:10px; border-radius:14px; }
    .container{ width:94%; padding-top:12px; }
    .hero{ padding:20px 14px 24px; }
    .hero h1{ font-size:24px; }
    .hero-photo{ height:110px; }
    .score-row{ padding:12px; }
    .rank{ width:36px; height:36px; font-size:15px; }
    .rank.medal{ font-size:19px; }
    .specialty{ font-size:15.5px; padding:0 10px; }
    .points{ font-size:14.5px; padding:5px 10px; }
  }

</style>
</head>

<body>

  <div class="fixed-logo">
    <img src="images/logo.jpeg" alt="شعار المدرسة">
  </div>

  <div class="container">

    <!-- الترويسة -->
    <div class="hero">
      <div class="hero-photo">
        <img src="images/header.jpeg" alt="صورة الترويسة">
      </div>
      <span class="crown">👑</span>
      <h1>لوحة المتصدرين</h1>
      <p>تابعي ترتيب التخصصات حسب مجموع النقاط</p>
    </div>

    <!-- لوحة المتصدرين (عرض فقط) -->
    <div class="leaderboard">
      <div class="leaderboard-title">ترتيب التخصصات</div>
      <div id="scores">
        <div class="loading">جاري تحميل النتائج...</div>
      </div>
      <div id="lastUpdate" class="last-update"></div>
    </div>

  </div>

<script>

  /* نفس رابط Apps Script المستخدم في صفحة الإدارة */
  const API_URL = 'https://script.google.com/macros/s/AKfycbxtY__oowjzs-wl_kzEQteE7eum25rZlbG06-N9KdbrX0XYMx7REriFTMKLUcnWVSCAJg/exec';

  /* ===== تحميل النقاط (قراءة فقط) ===== */
  function loadScores() {
    fetch(API_URL)
      .then(r => r.json())
      .then(data => {
        displayScores(data);
        const now = new Date();
        document.getElementById('lastUpdate').textContent =
          'آخر تحديث: ' + now.toLocaleTimeString('ar-OM', { hour: '2-digit', minute: '2-digit' });
      })
      .catch(err => {
        console.error(err);
        document.getElementById('scores').innerHTML =
          '<div class="message error">حدث خطأ أثناء تحميل النتائج</div>';
      });
  }

  /* ===== عرض النقاط ===== */
  function displayScores(data) {
    const container = document.getElementById('scores');
    container.innerHTML = '';

    if (!data || data.length === 0) {
      container.innerHTML = '<div class="loading">لا توجد نقاط حتى الآن</div>';
      return;
    }

    data.forEach(function(item, index) {
      let medal, rankClass = 'rank', rowClass = 'score-row';

      if (index === 0) { medal = '🥇'; rankClass += ' medal'; rowClass += ' top1'; }
      else if (index === 1) { medal = '🥈'; rankClass += ' medal'; rowClass += ' top2'; }
      else if (index === 2) { medal = '🥉'; rankClass += ' medal'; rowClass += ' top3'; }
      else { medal = index + 1; }

      const row = document.createElement('div');
      row.className = rowClass;
      row.innerHTML = `
        <div class="${rankClass}">${medal}</div>
        <div class="specialty">${escapeHtml(item.specialty)}</div>
        <div class="points">${item.points} نقطة</div>
      `;
      container.appendChild(row);
    });
  }

  /* ===== حماية النص ===== */
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  /* ===== تشغيل الصفحة: تحديث تلقائي كل 10 ثوانٍ ===== */
  loadScores();
  setInterval(loadScores, 10000);

</script>

</body>
</html>
